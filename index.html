<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Learning</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8ff;
  color:#17324d;
}
.header{
  background:linear-gradient(135deg,#1769aa,#42a5f5);
  color:white;
  padding:28px 20px;
  border-radius:0 0 25px 25px;
}
.header h1{margin:0;font-size:30px}
.header p{margin:8px 0 0}

.container{padding:20px}

h2{margin-top:25px}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  background:white;
  padding:22px 10px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 4px 12px #0002;
  font-size:18px;
  cursor:pointer;
}

.card:active{
  transform:scale(.96);
}

.icon{font-size:38px;display:block;margin-bottom:8px}

.welcome{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-top:20px;
  box-shadow:0 4px 12px #0001;
}
</style>
</head>

<body>

<div class="header">
  <h1>📚 Smart Learning</h1>
  <p>इयत्ता ६ वी • मराठी माध्यम</p>
</div>

<div class="container">

<div class="welcome">
  <h2>👋 नमस्कार विद्यार्थी!</h2>
  <p>शिका • प्रयोग करा • खेळत शिकूया!</p>
</div>

<h2>📖 Learning</h2>

<div class="grid">

<div class="card" onclick="alert('Books उघडत आहेत...')">
<span class="icon">📚</span>
Books
</div>

<div class="card" onclick="alert('Videos उघडत आहेत...')">
<span class="icon">🎥</span>
Videos
</div>

<div class="card" onclick="alert('Interactive Simulations उघडत आहेत...')">
<span class="icon">🧪</span>
Simulations
</div>

<div class="card" onclick="alert('Quiz सुरू होत आहे...')">
<span class="icon">📝</span>
Quiz
</div>

</div>

<h2>🎓 Subjects</h2>

<div class="grid">

<div class="card">
<span class="icon">🔬</span>
Science
</div>

<div class="card">
<span class="icon">➗</span>
Mathematics
</div>

<div class="card">
<span class="icon">🌍</span>
Geography
</div>

<div class="card">
<span class="icon">📖</span>
Marathi
</div>

</div>

<h2>🚀 Go Beyond Academics</h2>

<div class="grid">

<div class="card">🤖<br>Robotics</div>
<div class="card">💻<br>Coding</div>
<div class="card">🎨<br>Arts</div>
<div class="card">🏃<br>Sports</div>

</div>

</div>

</body>
</html>
